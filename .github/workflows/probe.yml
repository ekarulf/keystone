name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Build candidate archives
        run: |
          mkdir -p d/pkg
          echo hi > d/pkg/keystone.exe
          echo lic > d/pkg/LICENSE
          cd d
          echo "=== tool availability"
          for t in 7z zip pwsh powershell python; do
            printf '%s: ' "$t"
            command -v "$t" || echo MISSING
          done
          echo "=== powershell 5.1"
          powershell -NoLogo -NonInteractive -Command "Compress-Archive -Path 'pkg' -DestinationPath 'a-ps51.zip' -Force" || echo failed
          echo "=== pwsh 7"
          pwsh -NoLogo -NonInteractive -Command "Compress-Archive -Path 'pkg' -DestinationPath 'a-pwsh.zip' -Force" || echo failed
          echo "=== 7z"
          7z a -tzip a-7z.zip pkg > /dev/null || echo failed
          echo "=== zip"
          zip -qr a-zip.zip pkg || echo failed
          ls -l ./*.zip || true

      - name: Report path separators
        run: |
          cd d
          printf 'import sys, zipfile\n' > sep.py
          printf 'for f in sys.argv[1:]:\n' >> sep.py
          printf '    print(f, zipfile.ZipFile(f).namelist())\n' >> sep.py
          for f in a-ps51.zip a-pwsh.zip a-7z.zip a-zip.zip; do
            if [ -f "$f" ]; then python sep.py "$f"; else echo "$f MISSING"; fi
          done
