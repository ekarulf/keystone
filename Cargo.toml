[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ekarulf/keystone"

[workspace.dependencies]
keystone-core = { path = "crates/keystone-core" }
keystone-macos = { path = "crates/keystone-macos" }
keystone-win32-sys = { path = "crates/keystone-win32-sys" }
keystone-windows = { path = "crates/keystone-windows" }
keystone-pki = { path = "crates/keystone-pki" }
keystone-roles-anywhere = { path = "crates/keystone-roles-anywhere" }
keystone-infra = { path = "crates/keystone-infra" }

base64 = "0.22"
# KMS is confined to the CLI crate. These are pinned to the newest releases
# whose declared MSRV is Rust 1.88. Default features would pull in SSO clients
# and the AWS-LC HTTPS stack; Keystone needs neither. The KMS `rustls` feature
# selects the ring-backed connector already used elsewhere in the workspace.
aws-config = { version = "=1.8.13", default-features = false, features = [
    "credentials-process",
    "rt-tokio",
] }
aws-sdk-kms = { version = "=1.99.0", default-features = false, features = [
    "rt-tokio",
    "rustls",
] }
clap = { version = "4", features = ["derive"] }
# The Secure Enclave binding. Its build script compiles a vendored Swift bridge,
# so it is a macOS-only, target-gated dependency of `keystone-macos` alone.
cryptokit-rs = "0.2.5"
fs2 = "0.4"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rand = "0.8"
# A safe `geteuid` for the file-ownership check in `keystone-core`. The workspace
# forbids `unsafe_code`, so calling libc directly is not an option, and an
# ownership check is what makes the permission check meaningful: a mode check
# alone treats another user's file as safe.
rustix = { version = "1", features = ["process"] }
# Raw Win32/CNG declarations for `keystone-win32-sys`. Microsoft's own bindings
# are used rather than hand-written `extern` blocks: a mistyped FFI signature is
# undefined behavior that a macOS build cannot catch.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "pem",
    "ring",
    "x509-parser",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Renders the embedded CDK templates. `default-features = false` drops the
# builtin filters that shell out or fetch, leaving pure text substitution.
tera = { version = "2", default-features = false }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "1.1"
# "verify" pulls in ring so certificate and CSR signatures can actually be
# checked; comparing issuer and subject names alone would accept a forged chain.
x509-parser = { version = "0.18", features = ["verify"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
